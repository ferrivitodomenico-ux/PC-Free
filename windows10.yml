services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "10G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
    volumes:
      - /tmp/docker-data:/storage
      - windows-data:/storage/windows-data
    devices:
      - /dev/kvm
      - /dev/net/tun
    stop_grace_period: 2m
    restart: always
volumes:
  windows-data:
